function setTheme(light){document.documentElement.classList.toggle('light',light);document.getElementById('themeBtn').textContent=light?'🌙':'☀️';localStorage.setItem('suwarnaTheme',light?'light':'dark')}document.getElementById('themeBtn').onclick=()=>setTheme(!document.documentElement.classList.contains('light'));setTheme(localStorage.getItem('suwarnaTheme')==='light');
document.getElementById('leaveAllowance').onchange=e=>{localStorage.setItem('leaveAllowance',Math.max(0,Number(e.target.value)||0));updateLeaveBalance()};document.getElementById('csvFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const text=await f.text(),parsed=normalize(csvRows(text));if(!parsed.length){alert('CSV not recognised. Use columns: date,shift');return}localStorage.setItem('suwarnaRotaCSV',text);shifts=parsed;viewMonth=(shifts.find(s=>s.iso>=localISO())||shifts[0]).iso.slice(0,7);buildMonthOptions();buildFilters();renderAll();document.getElementById('dataNotice').textContent=`Current source: CSV saved on this device · ${shifts.length} days · v${VERSION}`};document.getElementById('resetData').onclick=()=>{localStorage.removeItem('suwarnaRotaCSV');location.reload()};document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.getElementById('saveNote').onclick=()=>{if(activeModalISO){const v=document.getElementById('noteText').value.trim();if(v)localStorage.setItem('note:'+activeModalISO,v);else localStorage.removeItem('note:'+activeModalISO);renderCalendar();closeModal()}};document.getElementById('deleteNote').onclick=()=>{if(activeModalISO){localStorage.removeItem('note:'+activeModalISO);document.getElementById('noteText').value='';renderCalendar();closeModal()}};
load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
