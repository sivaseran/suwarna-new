function weekNo(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-y)/86400000)+1)/7)}
function normalize(data){return data.map(r=>{const iso=(r.iso||r.date||r.Date||r['ISO Date']||'').trim();const sh=(r.shift||r.Shift||'').trim()||'Off';const d=new Date(iso+'T12:00:00');return{iso,date:d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}),week:weekNo(d),shift:sh}}).filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.iso)&&!Number.isNaN(new Date(r.iso+'T12:00:00').valueOf())).sort((a,b)=>a.iso.localeCompare(b.iso))}
function csvRows(text){const result=[],rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"')quoted=false;else field+=ch}else if(ch==='"')quoted=true;else if(ch===','){row.push(field);field=''}else if(ch==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}else field+=ch}if(field||row.length){row.push(field.replace(/\r$/,''));rows.push(row)}if(!rows.length)return result;const h=rows[0].map(x=>x.trim().toLowerCase());for(const r of rows.slice(1)){if(!r.some(x=>x.trim()))continue;const o={};h.forEach((k,i)=>o[k]=(r[i]||'').trim());result.push({date:o.date||o['iso date'],shift:o.shift})}return result}
let shifts=[],filter='All',query='',viewMonth=null;
async function load(){let source='Built-in verified data';const local=localStorage.getItem('suwarnaRotaCSV');if(local){shifts=normalize(csvRows(local));source='CSV saved on this phone'}else{try{const r=await fetch('rota.csv?v=20260725-final',{cache:'no-store'});if(!r.ok)throw Error();shifts=normalize(csvRows(await r.text()));source='GitHub rota.csv'}catch{shifts=normalize(fallback)}}if(!shifts.length)shifts=normalize(fallback);document.getElementById('dataNotice').textContent=`Current source: ${source} · ${shifts.length} days`;viewMonth=(shifts.find(s=>s.iso>=localISO())||shifts[0]).iso.slice(0,7);buildFilters();renderAll()}
const filterDefs=[['All','All shifts'],['Working','Working'],['Night','Nights'],['LongDay','Long days'],['Day','Day shifts'],['AnnualLeave','Annual leave'],['StudyLeave','Study leave'],['SickLeave','Sick leave'],['Off','Off']];
function buildFilters(){document.getElementById('filters').innerHTML=filterDefs.map(([k,l])=>`<button class="${k===filter?'active':''}" data-filter="${k}">${l}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;buildFilters();renderList()})}
function matches(s){const k=kind(s.shift);const f=filter==='All'||(filter==='Working'&&!['Off','AnnualLeave','StudyLeave','SickLeave'].includes(k))||(filter==='Night'&&(k==='Night1'||k==='Night2'))||k===filter;return f&&(!query||`${s.date} ${s.shift}`.toLowerCase().includes(query))}
function renderAll(){const first=shifts[0],last=shifts.at(-1);document.getElementById('range').textContent=`${new Date(first.iso+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})} → ${new Date(last.iso+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;renderNext();renderList();renderCalendar();renderStats()}
function isWork(s){return !['Off','AnnualLeave','StudyLeave','SickLeave'].includes(kind(s.shift))}
function renderNext(){const t=localISO(),n=shifts.find(s=>s.iso>=t&&isWork(s));document.getElementById('nextMain').textContent=n?`${meta(n.shift).icon} ${n.shift}${shiftTime(n)?' · '+shiftTime(n):''}`:'No future working shifts';document.getElementById('nextSub').textContent=n?new Date(n.iso+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):''}
function renderList(){const data=shifts.filter(matches),today=localISO(),next=shifts.find(s=>s.iso>=today&&isWork(s));const groups=new Map();data.forEach(s=>{const mon=new Date(s.iso+'T12:00:00');mon.setDate(mon.getDate()-((mon.getDay()+6)%7));const key=localISO(mon);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s)});let h='';for(const arr of groups.values()){h+=`<div class="week"><div class="week-title">Week ${arr[0].week} · ${arr[0].date.slice(4)} – ${arr.at(-1).date.slice(4)}</div>`;for(const s of arr){const x=meta(s.shift),isToday=s.iso===today,isNext=next&&s.iso===next.iso;h+=`<div class="shift ${kind(s.shift)==='Off'?'off':''} ${isToday?'today':''} ${isNext?'next':''}" style="--c:${x.c}"><div class="date">${s.date.slice(0,10)}</div><div>${x.icon}</div><div class="name" style="color:${x.c}">${s.shift}${isToday?'<span class="badge">TODAY</span>':''}</div><div class="time">${shiftTime(s)}</div></div>`}h+='</div>'}document.getElementById('list').innerHTML=h||'<div class="hero-sub">No matching shifts.</div>'}
function renderCalendar(){const [y,mo]=viewMonth.split('-').map(Number),first=new Date(y,mo-1,1),last=new Date(y,mo,0);document.getElementById('monthTitle').textContent=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('');h+='<div class="day blank"></div>'.repeat((first.getDay()+6)%7);const today=localISO();for(let d=1;d<=last.getDate();d++){const iso=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`,s=shifts.find(x=>x.iso===iso),x=meta(s?.shift||'Off');const short=s?s.shift.replace(/^Short Day$/,'Short').replace(/^Annual Leave.*$/,'AL').replace(/^Professional\/Study Leave$/,'PSL'):'';h+=`<div class="day ${iso===today?'today':''}" style="--c:${x.c}"><div class="daynum">${d}</div>${s?`<div class="dot"></div><div class="calshift">${x.icon}<br>${short}</div>`:''}</div>`}document.getElementById('calendar').innerHTML=h}
function renderStats(){const work=shifts.filter(isWork),hours=work.reduce((a,s)=>{const t=shiftTime(s);if(!t)return a;const [st,en]=t.split('–'),[h1,m1]=st.split(':').map(Number),[h2,m2]=en.split(':').map(Number);let mins=h2*60+m2-h1*60-m1;if(mins<0)mins+=1440;return a+mins/60},0);const cards=[['Working shifts',work.length],['Off days',shifts.filter(s=>kind(s.shift)==='Off').length],['Night shifts',work.filter(s=>['Night1','Night2'].includes(kind(s.shift))).length],['Scheduled hours',Math.round(hours)],['Annual leave',shifts.filter(s=>kind(s.shift)==='AnnualLeave').length],['Study leave',shifts.filter(s=>kind(s.shift)==='StudyLeave').length],['Sick leave',shifts.filter(s=>kind(s.shift)==='SickLeave').length]];document.getElementById('stats').innerHTML=cards.map(([a,b])=>`<div class="stat"><strong>${b}</strong><span>${a}</span></div>`).join('')}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.tab+'Panel').classList.add('active')});document.getElementById('search').oninput=e=>{query=e.target.value.trim().toLowerCase();renderList()};document.getElementById('todayBtn').onclick=()=>{filter='All';query='';document.getElementById('search').value='';buildFilters();renderList();document.querySelector('.shift.today')?.scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('prevMonth').onclick=()=>{let[y,m]=viewMonth.split('-').map(Number);m--;if(!m){m=12;y--}viewMonth=`${y}-${String(m).padStart(2,'0')}`;renderCalendar()};document.getElementById('nextMonth').onclick=()=>{let[y,m]=viewMonth.split('-').map(Number);m++;if(m===13){m=1;y++}viewMonth=`${y}-${String(m).padStart(2,'0')}`;renderCalendar()};function setTheme(light){document.documentElement.classList.toggle('light',light);document.getElementById('themeBtn').textContent=light?'🌙':'☀️';localStorage.setItem('suwarnaTheme',light?'light':'dark')}document.getElementById('themeBtn').onclick=()=>setTheme(!document.documentElement.classList.contains('light'));setTheme(localStorage.getItem('suwarnaTheme')==='light');document.getElementById('csvFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const text=await f.text(),parsed=normalize(csvRows(text));if(!parsed.length){alert('CSV not recognised. Use columns: date,shift');return}localStorage.setItem('suwarnaRotaCSV',text);shifts=parsed;viewMonth=(shifts.find(s=>s.iso>=localISO())||shifts[0]).iso.slice(0,7);document.getElementById('dataNotice').textContent=`Current source: CSV saved on this phone · ${shifts.length} days`;buildFilters();renderAll()};document.getElementById('resetData').onclick=()=>{localStorage.removeItem('suwarnaRotaCSV');location.reload()};load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
